<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23061A14'/><circle cx='50' cy='50' r='34' stroke='%2318C77A' stroke-width='6' fill='none'/><circle cx='50' cy='50' r='16' fill='%2348F5A3'/><line x1='15' y1='50' x2='85' y2='50' stroke='%2348F5A3' stroke-width='3' stroke-dasharray='4 3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biofilm AI — AI-Driven Hyperspectral Biofilm Profiling</title>
    <meta name="description" content="Digital Hyperspectral Laboratory: Uncover hidden microbial signatures through hyperspectral imaging, spatial-spectral feature extraction, and convolutional neural networks." />
    
    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN with Biofilm AI Emerald Laboratory Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              display: ['"Space Grotesk"', '"Inter"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              // Scientific Deep Green & Emerald Palette
              lab: {
                base: '#061A14',       // Deep Laboratory Green (Main Page BG)
                dark: '#0A241B',       // Dark Green Surfaces
                card: '#0D2B20',       // Card Green Surface
                elevated: '#11382A',   // Elevated Surface
                highest: '#174735',    // Highlight Surface
                border: '#1B4435',     // Standard Border
                borderGlow: '#28634E', // Active Border
                emerald: '#18C77A',    // Primary Emerald
                bright: '#48F5A3',     // Bright Emerald
                mint: '#9BEFCE',       // Soft Mint
                white: '#F4FFF9',      // Primary White
                textSec: '#B4C9C0',    // Secondary Text
                textMuted: '#829A90',  // Muted Text
                warning: '#F5C451',    // Warning Amber
                error: '#FF5C6C',      // Error / Pathogen Coral
              }
            }
          }
        }
      }
    </script>

    <!-- Three.js & OrbitControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body class="bg-[#061A14] text-[#F4FFF9] font-sans antialiased overflow-x-hidden min-h-screen selection:bg-[#18C77A]/30 selection:text-[#48F5A3]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
